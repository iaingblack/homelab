name: Build CI image

on:
  push:
    paths:
      - build/ci/Dockerfile
      - .github/workflows/build-ci-image.yml
  pull_request:
    paths:
      - build/ci/Dockerfile
      - .github/workflows/build-ci-image.yml
  workflow_dispatch:
    inputs:
      image_version:
        description: Version tag to publish for the main CI workflow (for example, v1)
        required: true
        default: v1
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-ci
          tags: |
            type=sha,format=long,prefix=sha-,enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.image_version || 'unused' }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and publish CI image
        uses: docker/build-push-action@v7
        with:
          context: ./build/ci
          file: ./build/ci/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

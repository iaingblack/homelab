---
# Copy this file to vars.yml and fill in the values for your VM and organization.
hetzner_public_ip: "REPLACE_WITH_SERVER_IP"
ssh_user: root
# Optional; omit this line to use your local SSH agent/default key discovery.
# ssh_private_key_file: "~/.ssh/hetzner_arc"

github_org: "REPLACE_WITH_GITHUB_ORG"

# Check the upstream release pages before changing these pinned versions.
kind_version: "v0.33.0"
arc_chart_version: "0.15.0"

# Snap channels can be changed to a specific supported track, such as 3/stable for Helm.
docker_snap_channel: "latest/stable"
helm_snap_channel: "latest/stable"
kubectl_snap_channel: "latest/stable"

kind_cluster_name: "hetzner-arc-k8s"
# Bind locally by default. Set this to the VM IP only if remote kubectl access is needed,
# and restrict TCP 45001 at the Hetzner firewall to trusted management IPs.
kind_api_server_address: "127.0.0.1"
kind_api_server_port: 45001

arc_working_directory: "/opt/hetzner-arc-k8s"
controller_namespace: "arc-systems"
runner_namespace: "arc-runners"
controller_release_name: "arc"
runner_scale_set_release_name: "hetzner-arc-k8s"
arc_secret_name: "github-arc-auth"

runner_group: "hetzner-arc-k8s"
runner_scale_set_name: "hetzner-arc-k8s"
min_runners: 0
max_runners: 5
